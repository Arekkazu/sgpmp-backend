# Mosquitto exclusivo G43. Listener interno 1883; el host solo publica 127.0.0.1:1884.
# Sin websockets. Sin TLS (lab local). Sin anonymous.
per_listener_settings false
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/secrets/
log_dest stdout
log_type error
log_type warning
log_type notice
