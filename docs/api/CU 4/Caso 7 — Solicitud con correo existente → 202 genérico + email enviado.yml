info:
  name: Caso 7 — Solicitud con correo existente → 202 genérico + email enviado
  type: http
  seq: 8

http:
  method: post
  url: http://localhost:8000/contrasena/recuperar
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "correo_electronico": "productor@pecuaria.co"
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
