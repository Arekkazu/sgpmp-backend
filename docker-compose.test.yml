name: sgpmp-backend-test

services:
  db:
    container_name: ${POSTGRES_DB:?POSTGRES_DB requerido para TEST}-db
    build:
      context: .
      dockerfile: Dockerfile.postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:?POSTGRES_DB requerido para TEST}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido para TEST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido para TEST}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido para TEST}
    # Se publica al host (no expose-only) a propósito: Pruebas/DBA necesitan
    # psql/DBeaver directo durante el ciclo de pruebas, mismo patrón que dev
    # (puerto 5447). Postgres sigue exigiendo usuario/contraseña; el control
    # real de seguridad es pedir que DB_PORT quede restringido en el
    # firewall del servidor a IPs conocidas, no abierto a 0.0.0.0/0 — ver
    # docs/SEGUIMIENTO-ENTORNO-TEST.md sección 10.
    ports:
      - "${DB_PORT:-5448}:5432"
    volumes:
      - sgpmp_pgdata_test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER requerido para TEST} -d ${POSTGRES_DB:?POSTGRES_DB requerido para TEST}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER requerido para TEST}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido para TEST}@${POSTGRES_DB:?POSTGRES_DB requerido para TEST}-db:5432/${POSTGRES_DB:?POSTGRES_DB requerido para TEST}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido para TEST}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL requerido para TEST}
      ENV: ${ENV:?ENV requerido para TEST}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ROOT_PATH: ${ROOT_PATH:-/api}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:?RECAPTCHA_SECRET_KEY requerido para TEST}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      MODELOS_STORAGE_PATH: ${MODELOS_STORAGE_PATH:-/tmp/sgpmp_modelos}
      AGROFUSION_SSO_PUBLIC_KEY_PATH: ${AGROFUSION_SSO_PUBLIC_KEY_PATH:-}
      AGROFUSION_PROJECT_CODE: ${AGROFUSION_PROJECT_CODE:-}
      AGROFUSION_ISSUER: ${AGROFUSION_ISSUER:-agrofusion-auth}
      AGROFUSION_HUB_CLIENT_ID: ${AGROFUSION_HUB_CLIENT_ID:-}
      AGROFUSION_HUB_CLIENT_SECRET: ${AGROFUSION_HUB_CLIENT_SECRET:-}
      RF71_INTERNAL_KEY: ${RF71_INTERNAL_KEY:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sgpmp_pgdata_test:
