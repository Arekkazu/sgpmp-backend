name: Versionamiento automatizado

# Flujo confirmado con el líder de desarrollo: dev publica release
# candidates (1.x.y-rc.N — ya arrancó a mano en v1.0.0-rc.1, este pipeline
# continúa esa numeración con rc.2, rc.3...). Cuando Pruebas aprueba un rc,
# se mergea dev -> main y ESE push computa la versión final estable
# (1.x.y, sin sufijo) sobre el mismo conjunto de commits — patrón estándar
# de "prerelease branch" de semantic-release, no hace falta un paso manual
# aparte. La rama test (ambiente de Pruebas) no dispara release propio: el
# rc ya generado en dev es lo que se despliega ahí para validar.
#
# Validado con una prueba aislada real en poc/docs-automation-setup (tag
# poc-v1.0.0, borrado tras confirmar) antes de promover esta config.
on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials debe quedar en true (default): semantic-
          # release/git hace un "git push" real, no una llamada API —
          # necesita que checkout deje el token configurado como
          # credencial de git. Con persist-credentials: false (como
          # estaba antes), el push falla con "Invalid username or token"
          # aunque GITHUB_TOKEN esté seteado como env var más abajo (eso
          # solo lo usa el plugin @semantic-release/github para la API,
          # no el git push).
          #
          # Token: el automático de Actions (github.token, ver "with:
          # token" default de actions/checkout) alcanza — ya tiene
          # contents:write por el bloque "permissions" de este workflow.
          # OJO: se había cambiado a secrets.GH_TOKEN más abajo, pero ese
          # secret NO existe en este repo (gh secret list solo muestra
          # DOCS_SGPMP_TOKEN) — quedaba vacío en runtime. Revertido al
          # token automático; si en el futuro hace falta un PAT real
          # (para saltar branch protection o encadenar otros workflows),
          # crearlo como secret y pasarlo tanto acá como en GITHUB_TOKEN
          # de abajo.

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Ejecutar semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Confirmar publicación
        run: echo "Versionamiento completado. Ver CHANGELOG.md y docs/trazabilidad/TRAZABILIDAD_CAMBIOS.md actualizados en este mismo commit."
