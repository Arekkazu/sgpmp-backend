name: PR checks (dev / main)

# "dev" y "main" son los dos destinos reales del flujo de dos etapas (ver
# .github/CONTRIBUTING.md sección 1): feature->dev lo aprueban Desarrollo/IoT,
# dev->main lo aprueban Pruebas/Proyecto. Mismos checks en ambos casos.
#
# TODO(POC): "poc/docs-automation-setup" está temporalmente en la lista de
# branches solo para poder validar este workflow sin abrir un PR contra
# dev/main reales. Quitarlo antes de promover esta plantilla.
on:
  pull_request:
    branches: [dev, main, poc/docs-automation-setup]
    types: [opened, edited, synchronize, reopened]

jobs:
  # 1. Valida que cada commit del PR sigue Conventional Commits
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  # 2. Verifica que el título del PR y al menos un commit referencian
  #    un RF/RNF válido y, si aplica, un RFC.
  verify-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar referencia a RF/RNF en el título del PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Título del PR: $PR_TITLE"
          if ! echo "$PR_TITLE" | grep -Eq '\((RF|RNF)-[0-9]+\)'; then
            echo "::error::El título del PR debe incluir un ID de requerimiento, ej: (RF-68)"
            exit 1
          fi
      - name: Descargar la RTM real (docs-sgpmp, privado)
        uses: actions/checkout@v4
        with:
          repository: miguelortiz13/docs-sgpmp
          token: ${{ secrets.DOCS_SGPMP_TOKEN }}
          sparse-checkout: |
            1-analisis/Matriz de Requerimientos F-NF.md
          sparse-checkout-cone-mode: false
          path: docs-sgpmp

      - name: Comprobar que el requerimiento existe en la RTM y no está Descartado
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          RTM_FILE="docs-sgpmp/1-analisis/Matriz de Requerimientos F-NF.md"
          RF_ID=$(echo "$PR_TITLE" | grep -oE '(RF|RNF)-[0-9]+' | head -1)

          if [ -z "$RF_ID" ]; then
            echo "::error::No se pudo extraer un ID de requerimiento del título del PR"
            exit 1
          fi

          echo "Validando $RF_ID contra la RTM ($RTM_FILE)..."

          ROW=$(grep -E "^\| $RF_ID \|" "$RTM_FILE" || true)
          if [ -z "$ROW" ]; then
            echo "::error::$RF_ID no existe en la RTM. Verifica el ID o actualiza Matriz de Requerimientos F-NF.md en docs-sgpmp primero."
            exit 1
          fi

          if echo "$ROW" | grep -qi "descartado"; then
            echo "::error::$RF_ID existe en la RTM pero está marcado como Descartado -- no se puede referenciar en un PR."
            exit 1
          fi

          echo "OK: $RF_ID encontrado y vigente en la RTM."
          echo "Fila: $ROW"

  # 3. Build y pruebas — stack real: Python 3.13 / FastAPI / pytest
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas (excluye integración, requiere Postgres dedicado)
        env:
          # No apunta a un Postgres real: create_engine() solo parsea la URL
          # al importar el módulo, no conecta. Los tests marcados como
          # "integration" (que sí necesitan DB real) quedan excluidos arriba.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
          SECRET_KEY: ci-placeholder-secret-key
        run: python -m pytest -m "not integration" --maxfail=1
