name: Diagnostico Alembic (solo lectura)

# Workflow temporal para investigar el alembic_version huerfano en la DB de
# test (INC-M01-03-119). No escribe nada: solo reporta version_num y marcadores
# de esquema reales para saber que migraciones estan realmente aplicadas.
# Se borra una vez resuelto el incidente de CI.
on:
  workflow_dispatch:

jobs:
  diagnosticar:
    name: Comparar alembic_version contra el esquema real
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Diagnostico DEV_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: python .github/scripts/diagnosticar_migraciones.py

      - name: Diagnostico TEST_DATABASE_URL
        if: always()
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: python .github/scripts/diagnosticar_migraciones.py
