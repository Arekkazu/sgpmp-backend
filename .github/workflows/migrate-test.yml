name: Deploy Migrations - test

# Se dispara cuando el equipo mergea la promoción dev -> test. Si la rama
# test tiene protección que impide push directo, este trigger equivale
# exactamente a "se completó el PR de promoción hacia test".
on:
  push:
    branches:
      - test
    paths:
      - "alembic/versions/**"
  workflow_dispatch:

concurrency:
  group: alembic-migrate-test
  cancel-in-progress: false

jobs:
  migrate:
    uses: ./.github/workflows/_migrate-template.yml
    with:
      environment_name: test
    secrets: inherit
