name: Validate Alembic Migrations

# No requiere DATABASE_URL: 'alembic heads' solo lee los archivos en
# alembic/versions/, no se conecta a ninguna base de datos. Por eso es
# seguro correrlo incluso en PRs desde forks.
on:
  pull_request:
    branches:
      - dev
      - test
    paths:
      - "alembic/versions/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar head único en el historial de Alembic
        run: |
          HEADS=$(alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Esta rama introduce múltiples heads de Alembic. Usa 'alembic merge heads' para unificarlas antes de mergear."
            alembic heads
            exit 1
          fi
          echo "OK: un solo head detectado."
