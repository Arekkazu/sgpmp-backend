name: Deploy Migrations to Dev & Test DBs

# Se dispara cuando llega un push a dev que toca la carpeta de
# migraciones de Alembic, o manualmente desde la pestaña Actions.
#
# workflow_dispatch existe porque el filtro de "paths" solo reacciona a
# pushes que tocan alembic/versions/. Si la DB se queda atrasada por
# cualquier motivo (un run que falló, una migración aplicada a mano),
# este es el botón para ponerla al día sin esperar a la próxima migración.
on:
  push:
    branches:
      - dev
    paths:
      - "alembic/versions/**"
  workflow_dispatch:
    inputs:
      stamp_dev:
        description: "Revisión a re-estampar en DEV_DATABASE_URL antes del upgrade. Solo para reparar un alembic_version huérfano en dev. Vacío en runs normales."
        required: false
        default: ""
      stamp_test:
        description: "Revisión a re-estampar en TEST_DATABASE_URL antes del upgrade. Solo para reparar un alembic_version huérfano en test. Vacío en runs normales."
        required: false
        default: ""
      solo_diagnostico:
        description: "true = no toca ninguna DB, solo compara alembic_version contra marcadores reales de esquema en dev y test (INC-M01-03-119)."
        required: false
        default: "false"

# Evita que dos runs se pisen si llegan varios pushes seguidos
concurrency:
  group: deploy-migrations-dev-test
  cancel-in-progress: false

jobs:
  diagnosticar:
    name: Comparar alembic_version contra el esquema real (solo lectura)
    if: github.event_name == 'workflow_dispatch' && inputs.solo_diagnostico == 'true'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install psycopg2-binary

      - name: Diagnóstico DEV_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: python .github/scripts/diagnosticar_migraciones.py

      - name: Diagnóstico TEST_DATABASE_URL
        if: always()
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: python .github/scripts/diagnosticar_migraciones.py

  migrate:
    name: Run Alembic upgrade on dev and test DBs
    if: github.event_name != 'workflow_dispatch' || inputs.solo_diagnostico != 'true'
    runs-on: ubuntu-latest
    # Si tienes un "environment" configurado en GitHub (Settings > Environments)
    # llamado "development", esto te permite además pedir aprobación manual
    # o restringir quién puede correr el job. Si no lo tienes, puedes borrar
    # esta línea sin problema.
    environment: development

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Escotilla de reparación para dev. Si alembic_version quedó apuntando a una
      # revisión borrada o reescrita, TODO comando de alembic falla con "Can't
      # locate revision". --purge reescribe la tabla sin tener que resolver la
      # revisión actual, que es justo lo que está roto. dev y test se reparan por
      # separado porque pueden quedar varadas en revisiones distintas (INC-M01-03-119:
      # dev llegó a repararse sola, test no) — estampar ambas con el mismo valor a
      # ciegas puede hacer retroceder una DB que ya estaba sana.
      - name: Reparar alembic_version en dev (solo si se pasó "stamp_dev")
        if: inputs.stamp_dev != ''
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: alembic stamp "${{ inputs.stamp_dev }}" --purge

      # Diagnóstico: si el upgrade falla (p. ej. por heads múltiples tras
      # mergear dos ramas con migraciones paralelas), estas dos líneas
      # dejan en el log en qué revisión está la DB y cuál es el head del repo.
      - name: Mostrar estado actual de la DB (current / heads)
        continue-on-error: true   # es diagnóstico: no debe decidir el resultado del job
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          alembic current
          alembic heads

      # Aplica TODAS las revisiones pendientes, no solo la del último push:
      # si hubo runs fallidos, este paso alcanza el backlog completo de una vez.
      # Si la DB ya está en head, no ejecuta nada.
      - name: Ejecutar alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: alembic upgrade head

      - name: Confirmar versión final aplicada
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: alembic current

      # Escotilla de reparación para test, misma lógica que la de dev pero con su
      # propia revisión: usar solo el valor real que corresponde al esquema que
      # la DB de test ya tiene aplicado (verificar con solo_diagnostico=true antes).
      - name: Reparar alembic_version en test (solo si se pasó "stamp_test")
        if: inputs.stamp_test != ''
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: alembic stamp "${{ inputs.stamp_test }}" --purge

      # Segundo destino: la DB de test va siempre al mismo head que dev, para
      # que las pruebas corran contra el esquema recién aplicado. Se ejecuta
      # después de dev: si dev falla, el job corta y test no se toca.
      - name: Ejecutar alembic upgrade head en la DB de test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          alembic current
          alembic upgrade head
          alembic current
