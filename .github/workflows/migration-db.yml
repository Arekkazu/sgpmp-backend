name: Deploy Migrations to Dev DB

on:
  push:
    branches:
      - dev
    paths:
      - "alembic/versions/**"

concurrency:
  group: deploy-migrations-dev
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Alembic upgrade on dev DB
    runs-on: ubuntu-latest

    environment: development

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mostrar estado actual de la DB
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          alembic current
          alembic heads

      - name: Ejecutar migraciones
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          alembic upgrade head

      - name: Confirmar versión final aplicada
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          alembic current