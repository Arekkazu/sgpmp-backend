name: Deploy Migrations to Dev DB

# Se dispara cuando llega un push a dev que toca la carpeta de
# migraciones de Alembic, o manualmente desde la pestaña Actions.
#
# workflow_dispatch existe porque el filtro de "paths" solo reacciona a
# pushes que tocan alembic/versions/. Si la DB se queda atrasada por
# cualquier motivo (un run que falló, una migración aplicada a mano),
# este es el botón para ponerla al día sin esperar a la próxima migración.
on:
  push:
    branches:
      - dev
    paths:
      - "alembic/versions/**"
  workflow_dispatch:

# Evita que dos runs se pisen si llegan varios pushes seguidos
concurrency:
  group: deploy-migrations-dev
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Alembic upgrade on dev DB
    runs-on: ubuntu-latest
    # Si tienes un "environment" configurado en GitHub (Settings > Environments)
    # llamado "development", esto te permite además pedir aprobación manual
    # o restringir quién puede correr el job. Si no lo tienes, puedes borrar
    # esta línea sin problema.
    environment: development

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Diagnóstico: si el upgrade falla (p. ej. por heads múltiples tras
      # mergear dos ramas con migraciones paralelas), estas dos líneas
      # dejan en el log en qué revisión está la DB y cuál es el head del repo.
      - name: Mostrar estado actual de la DB (current / heads)
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          alembic current
          alembic heads

      # Aplica TODAS las revisiones pendientes, no solo la del último push:
      # si hubo runs fallidos, este paso alcanza el backlog completo de una vez.
      # Si la DB ya está en head, no ejecuta nada.
      - name: Ejecutar alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: alembic upgrade head

      - name: Confirmar versión final aplicada
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: alembic current
