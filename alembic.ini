# Configuración de Alembic para sgpmp-backend.
#
# La URL de conexión NO se hardcodea acá: env.py la lee de DATABASE_URL
# (mismo patrón que src/shared/database.py), así "alembic upgrade head"
# apunta a la base que indique el .env activo (sgpmp o pruebas).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
