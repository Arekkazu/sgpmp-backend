# Override SOLO para servidores donde el enrutamiento por dominio de
# Traefik no funciona (ej. el servidor Oracle actual, donde 80/443 los
# ocupa un nginx ajeno y el firewall no deja pasar los puertos reales
# de Traefik). Publica el backend directo a un puerto de host que se
# debe pedir habilitar explícitamente en el firewall del servidor.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.direct-port.yml up -d
#
# En un servidor Dokploy sano (Traefik por dominio funcionando), NO
# uses este archivo — el docker-compose.yml base ya es suficiente.
services:
  backend:
    ports:
      - "${BACKEND_PORT:-8010}:8000"
