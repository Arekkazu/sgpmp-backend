[pytest]
# Sin esto, pytest recolecta los repos de AgroFusion vendorizados bajo
# anotaciones/ y aborta con ModuleNotFoundError antes de correr un solo test.
testpaths = tests
markers =
    integration: requiere una PostgreSQL exclusiva indicada por TEST_DATABASE_URL
    firma_real: prueba la verificación real de la firma del artefacto de M04 (sin el simulador de tests/prediction)
